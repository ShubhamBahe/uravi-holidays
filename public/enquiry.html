(function () {
  var $ = function (id) { return document.getElementById(id); };
  var corp = location.pathname.split('/').pop().toLowerCase() === 'corporate-travel.php';
  var t = corp ? 'Corporate Travel' : 'Customized Holidays';
  document.title = t + ' | Uravi Holidays';
  $('pageH1').textContent = t;
  $('crumbs').innerHTML = '<li><a href="/index.php">Home</a></li><li aria-current="page">' + t + '</li>';
  var items = corp
    ? ['Business trips, conferences and incentive tours', 'Group tickets, hotels and ground transport', 'Team outings and adventure camps near Nagpur', 'One point of contact for your whole team']
    : ["Family, honeymoon and friends' trips", 'Domestic and international destinations', 'Hotels, transfers and sightseeing in one plan', 'We edit the plan until you are happy'];
  if (corp) { $('enqH2').textContent = 'Travel for your team, handled'; $('enqP').textContent = 'Tell us about your group and we will prepare a corporate travel proposal.'; }
  $('enqList').innerHTML = items.map(function (i) { return '<li>' + i.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</li>'; }).join('');
  UraviForm($('enqForm'), { type: corp ? 'corporate' : 'custom', title: corp ? 'Request a corporate quote' : 'Plan my holiday',
    fields: ['name', 'phone', 'email', 'destination', 'travel_date', 'travelers', 'budget', 'message'], submit: 'Request a Quote' });
})();
